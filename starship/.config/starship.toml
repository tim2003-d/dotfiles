"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
[](fg:os_bg bg:dir_bg)\
$directory\
[](fg:dir_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg bg:venv_bg)\
$python\
[](fg:venv_bg)\
\n$character"""

palette = "custom_colors"

[palettes.custom_colors]
os_bg = "#8e9299"
os_fg = "#090c0c"
dir_bg = "#283662"
dir_fg = "#e3e5e5"
git_bg = "#5267aa"
git_fg = "#e3e5e5"
venv_bg = "#d97706"
venv_fg = "#090c0c"

[os]
disabled = false
style = "fg:os_fg bg:os_bg"
format = "[ $symbol ]($style)"

[directory]
style = "fg:dir_fg bg:dir_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:git_bg"
format = '[[ $symbol $branch ](fg:git_fg bg:git_bg)]($style)'

[git_status]
style = "bg:git_bg"
format = '[[($all_status$ahead_behind )](fg:git_fg bg:git_bg)]($style)'

[python]
symbol = " "
style = "fg:venv_fg bg:venv_bg"
format = '[ $symbol($virtualenv )]($style)'
pyenv_version_name = false
detect_extensions = []
detect_files = []

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""